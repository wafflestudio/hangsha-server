version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: campus-mysql
    ports:
      - "3307:3306"
    environment:
      TZ: Asia/Seoul
      MYSQL_DATABASE: campus_db
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - ./db_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  adminer:
    image: adminer
    ports:
      - "8081:8080"

  manticore:
    image: manticoresearch/manticore:latest
    container_name: campus-manticore
    ports:
      - "19306:9306"   # MySQL protocol (SQL queries / debug)
      - "19308:9308"   # HTTP JSON API
    environment:
      - EXTRA=1
    volumes:
      - ./manticore_data:/var/lib/manticore
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
    restart: unless-stopped

  kiwi:
    build:
      context: ../kiwi-service
    container_name: campus-kiwi
    ports:
      - "8090:8090"
    restart: unless-stopped

  valkey:
    # 배포 환경(hangsha-valkey)과 동일한 이미지
    image: valkey/valkey:9-alpine
    container_name: campus-valkey
    ports:
      - "6380:6379"   # 로컬 6379는 다른 프로세스가 점유하는 경우가 있어 6380으로 매핑
    restart: unless-stopped